<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Palco Holyrics</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; }

        body {
            background: #000;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Layout principal ── */
        .viewer {
            flex: 1;
            display: flex;
            gap: 10px;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }
        .current {
            flex: 3;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #333;
            position: relative;
        }
        .next {
            flex: 1;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            border: 1px solid #333;
            min-width: 250px;
        }
        .hidden { display: none !important; }

        #textoContainer, #textoProximo, #atualContainer {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
        /* Prévia de vídeo isolada: só substitui o campo Atual enquanto um vídeo toca. */
        #videoAtual {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
            object-fit: contain;
        }
        body.modo-texto-ativo #videoAtual { display: none !important; }

        .video-token-overlay {
            position: fixed;
            inset: 0;
            z-index: 2500;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 8px;
            overflow-y: auto;
            overscroll-behavior: contain;
            background: rgba(0,0,0,.82);
        }
        .video-token-card {
            width: min(520px, 100%);
            max-height: calc(100vh - 16px);
            max-height: calc(100dvh - 16px);
            overflow-y: auto;
            overscroll-behavior: contain;
            margin: auto 0;
            padding: 14px 18px;
            background: #171717;
            color: #fff;
            border: 1px solid #444;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,.55);
        }
        .video-token-card h3 { margin: 0 0 6px; font-size: 18px; }
        .video-token-card p { font-size: 12px; line-height: 1.35; color: #ddd; margin: 5px 0 8px; }
        .video-token-card label { display: block; font-size: 12px; }
        .video-token-card input {
            display: block;
            width: 100%;
            padding: 7px 10px;
            margin: 4px 0 8px;
            background: #050505;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 16px;
            min-height: 36px;
        }
        .video-token-actions { display: flex; gap: 10px; margin-top: 6px; }
        .video-token-actions button {
            flex: 1;
            padding: 9px;
            border: 0;
            border-radius: 6px;
            color: #fff;
            background: #1565c0;
            font-size: 14px;
        }
        .video-token-actions button.secondary { background: #444; }
        #videoTokenFeedback { display: block; min-height: 18px; color: #ffcc80; font-size: 12px; margin-top: 8px; }
        @media (orientation: landscape) and (max-height: 520px) {
            .video-token-overlay { padding: 4px; }
            .video-token-card {
                width: min(760px, 100%);
                max-height: calc(100vh - 8px);
                max-height: calc(100dvh - 8px);
                padding: 9px 14px;
            }
            .video-token-card h3 { font-size: 16px; margin-bottom: 4px; }
            .video-token-card p { font-size: 11px; line-height: 1.25; margin: 3px 0 5px; }
            .video-token-card input { padding: 5px 8px; min-height: 30px; margin: 3px 0 5px; }
            .video-token-actions button { padding: 7px; }
        }
        img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .next-title {
            padding: 5px;
            text-align: center;
            background: #222;
            font-size: 14px;
            flex-shrink: 0;
        }

        /* ── Botões de navegação ── */
        .nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 50px;
            z-index: 1000;
            outline: none;
            cursor: pointer;
        }
        #btnPrev { left: 10px; }
        #btnNext { right: 10px; }

        /* Esconde só os botões de navegação no modo texto */
        body.modo-texto-ativo #btnPrev,
        body.modo-texto-ativo #btnNext {
            display: none !important;
        }

        /* No modo texto: slide atual em tela cheia (esconde painel próximo) */
        body.modo-texto-ativo .next {
            display: none !important;
        }
        body.modo-texto-ativo .current {
            flex: 1;
        }

        /* ── Grupo de botões fixos (canto inferior direito) ── */
        #btn-grupo {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: row;
            gap: 12px;
            z-index: 1000;
            align-items: center;
        }

        #btnToggle, #btnPlaylist {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            outline: none;
            cursor: pointer;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            line-height: 1.2;
        }

        #btnToggle   { background: #c00; }
        #btnPlaylist { background: #1565c0; font-size: 32px; }

        #btnPlaylist:hover { background: #1976d2; }
        #btnPlaylist.ativo { background: #0d47a1; }

        /* ── GAVETA ── */
        #gaveta {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 0;
            background: #111;
            border-top: 2px solid #1565c0;
            z-index: 999;
            overflow: hidden;
            transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        #gaveta.aberta { height: 45vh; }

        /* Header da gaveta */
        .gaveta-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px;
            background: #1a1a2e;
            flex-shrink: 0;
            border-bottom: 1px solid #333;
            gap: 10px;
        }

        /* ── Abas ── */
        .gaveta-tabs {
            display: flex;
            gap: 4px;
            flex: 1;
        }
        .tab-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 6px 6px 0 0;
            background: #2a2a40;
            color: #888;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            letter-spacing: 0.5px;
        }
        .tab-btn:hover { background: #333355; color: #bbb; }
        .tab-btn.ativa { background: #1565c0; color: #fff; }

        /* Ações à direita */
        .gaveta-acoes {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        .btn-gaveta-acao {
            background: #1e3a5f;
            border: 1px solid #1565c0;
            border-radius: 6px;
            color: #90caf9;
            font-size: 12px;
            padding: 5px 10px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-gaveta-acao:hover { background: #1565c0; color: #fff; }
        .btn-fechar-gaveta {
            background: transparent;
            border: 1px solid #555;
            border-radius: 6px;
            color: #aaa;
            font-size: 18px;
            line-height: 1;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-fechar-gaveta:hover { background: #333; color: #fff; }

        /* Corpo da gaveta */
        .gaveta-body {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Status (loading/erro) */
        .gaveta-status {
            padding: 18px;
            text-align: center;
            color: #888;
            font-size: 14px;
            flex-shrink: 0;
        }

        /* Lista de itens */
        .lista-playlist {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        .lista-playlist::-webkit-scrollbar { width: 6px; }
        .lista-playlist::-webkit-scrollbar-track { background: #111; }
        .lista-playlist::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        .lista-playlist::-webkit-scrollbar-thumb:hover { background: #666; }

        /* Itens da lista */
        .playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            cursor: pointer;
            border-bottom: 1px solid #1e1e1e;
            transition: background 0.15s;
            user-select: none;
        }
        .playlist-item:hover { background: #1e2d45; }
        .playlist-item.ativo {
            background: #0d2a4a;
            border-left: 3px solid #42a5f5;
        }
        .playlist-item.titulo-secao {
            background: #161616;
            cursor: default;
            padding: 4px 14px;
            border-bottom: 1px solid #2a2a2a;
        }
        .playlist-item.titulo-secao:hover { background: #161616; }
        .playlist-item.titulo-secao .item-nome {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4caf50;
            font-weight: bold;
        }

        .item-icone {
            font-size: 18px;
            flex-shrink: 0;
            width: 24px;
            text-align: center;
        }
        .item-info { flex: 1; overflow: hidden; }
        .item-nome {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e0e0e0;
        }
        .item-artista {
            font-size: 11px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-tipo {
            font-size: 10px;
            color: #555;
            flex-shrink: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-ativo {
            font-size: 9px;
            background: #1565c0;
            color: #fff;
            padding: 2px 6px;
            border-radius: 10px;
            flex-shrink: 0;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 3px solid #333;
            border-top-color: #1565c0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="viewer">
        <div class="current">
            <video id="videoAtual" class="hidden" playsinline muted preload="auto"></video>
            <iframe id="atualContainer" src="about:blank"></iframe>
            <iframe id="textoContainer" class="hidden" src="about:blank"></iframe>
        </div>
        <div class="next" id="nextPanel">
            <div class="next-title">Próximo</div>
            <img id="nextSlide">
            <iframe id="textoProximo" class="hidden" src="about:blank"></iframe>
        </div>
    </div>

    <!-- Configuração da conexão OBS WebSocket usada exclusivamente pela prévia do campo Atual. -->
    <div id="videoTokenOverlay" class="video-token-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="videoTokenTitle">
        <div class="video-token-card">
            <h3 id="videoTokenTitle">Conectar à fonte de vídeo do OBS</h3>
            <p id="videoTokenExplanation">O aplicativo vai ler automaticamente a URL atual da fonte no OBS. Informe o endereço, a porta e a senha do OBS WebSocket (não é o token da API do Holyrics). Os dados ficam salvos somente neste aparelho.</p>
            <label for="obsWsHostInput">IP ou host do computador com OBS</label>
            <input id="obsWsHostInput" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="192.168.10.x">
            <label for="obsWsPortInput">Porta do OBS WebSocket</label>
            <input id="obsWsPortInput" type="number" inputmode="numeric" min="1" max="65535" placeholder="Porta configurada no OBS">
            <label for="obsWsPasswordInput">Senha do OBS WebSocket</label>
            <input id="obsWsPasswordInput" type="password" autocomplete="new-password" placeholder="Senha configurada no OBS">
            <label for="obsWsInputName">Nome da fonte no OBS</label>
            <input id="obsWsInputName" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" value="VIDEO HOLYRICS">
            <div class="video-token-actions">
                <button id="btnSalvarVideoToken" type="button">Testar e salvar</button>
                <button id="btnCancelarVideoToken" class="secondary" type="button">Depois</button>
            </div>
            <small id="videoTokenFeedback"></small>
        </div>
    </div>

    <!-- Botões de navegação -->
    <button class="nav-btn" id="btnPrev" onclick="sendCmd('ActionPrevious')">◀</button>
    <button class="nav-btn" id="btnNext" onclick="sendCmd('ActionNext')">▶</button>

    <!-- Grupo de botões inferiores -->
    <div id="btn-grupo">
    <button id="btnToggle" onclick="toggleModo()" title="Modo texto">👁️</button>
    <button id="btnPlaylist" onclick="toggleGaveta()" title="Lista de reprodução">☰</button>
    </div>

    <!-- Gaveta de playlist -->
    <div id="gaveta">
        <div class="gaveta-header">
            <div class="gaveta-tabs">
                <button class="tab-btn ativa" id="tab-letras" onclick="trocarAba('letras')">🎵 Letras</button>
                <button class="tab-btn"        id="tab-midia"  onclick="trocarAba('midia')">🎬 Mídia</button>
            </div>
            <div class="gaveta-acoes">
                <button class="btn-gaveta-acao" onclick="carregarAbaAtual()">↻ Atualizar</button>
                <button class="btn-fechar-gaveta" onclick="fecharGaveta()">✕</button>
            </div>
        </div>

        <!-- Painel Letras -->
        <div class="gaveta-body" id="painel-letras">
            <div class="gaveta-status" id="status-letras"></div>
            <div class="lista-playlist" id="lista-letras"></div>
        </div>

        <!-- Painel Mídia -->
        <div class="gaveta-body hidden" id="painel-midia">
            <div class="gaveta-status" id="status-midia"></div>
            <div class="lista-playlist" id="lista-midia"></div>
        </div>
    </div>

    <script>
        const DEFAULT_HOLYRICS_IP = "192.168.10.178";
        const HOLYRICS_IP_KEY = "catedralHolyricsServerIp";
        const HOLYRICS_API_PORT = 4455;
        const TOKEN = "A9DDQuW0b3CZhc5p";

        function getHolyricsIp() {
            const saved = (localStorage.getItem(HOLYRICS_IP_KEY) || '').trim();
            // Corrige o IP antigo incorreto salvo localmente durante os testes.
            if (saved === '92.168.10.10' || saved === '192.168.10.10') {
                localStorage.setItem(HOLYRICS_IP_KEY, DEFAULT_HOLYRICS_IP);
                return DEFAULT_HOLYRICS_IP;
            }
            return saved || DEFAULT_HOLYRICS_IP;
        }

        function getHolyricsApiBase() {
            return 'http://' + getHolyricsIp() + ':' + HOLYRICS_API_PORT;
        }

        function aplicarEnderecoHolyricsNasTelas() {
            const base = 'http://' + getHolyricsIp();
            const atual = document.getElementById('atualContainer');
            const texto = document.getElementById('textoContainer');
            const proximo = document.getElementById('textoProximo');
            if (atual) atual.src = base + '/stage-view/widescreen';
            if (texto) texto.src = base + ':80/view/text2';
            if (proximo) proximo.src = base + ':80/stage-view/text';
        }

        let modoTexto    = false;
        let gavetaAberta = false;
        let abaAtual     = 'letras';
        let proximoVisivel = true;
        let lastSlideNumber = null;

        // Estado isolado da prévia de vídeo no campo Atual.
        const OBS_VIDEO_CONFIG_KEY = 'catedralObsVideoConnection';
        const OBS_VIDEO_CONFIG_VERSION_KEY = 'catedralObsVideoConfigVersion';
        const OBS_VIDEO_CONFIG_VERSION = '2';
        let videoPreviewUrl = '';
        let videoPreviewPath = '';
        let videoPreviewActive = false;
        let videoPreviewErrorPath = '';
        let videoTokenPromptDismissedPath = '';
        let latestMediaPlayerInfo = null;
        // undefined = ainda não consultado; null = nenhuma apresentação ativa; objeto = PPT/letra/imagem/texto etc.
        let latestCurrentPresentation;
        let lastReceivedPreviewSignature = '';
        // Fonte que representa a solicitação mais recente do Holyrics:
        // "video" = vídeo direto; "holyrics" = letra, imagem, PPT, texto ou tela do Holyrics.
        let fonteAtualSolicitada = '';
        let ultimaAssinaturaApresentacao;
        let ultimaIdentidadeVideo = '';
        let ultimoPlayingVideo = null;
        let ultimoTempoVideoMs = null;
        let videoRequestJustDetectedThisPoll = false;
        let mediaStopInFlight = false;
        let catedralPreviewEndpointWarned = false;
        let videoPreviewErrorUrl = '';

        // Conexão persistente ao OBS WebSocket v5. Não interfere nas chamadas da API do Holyrics.
        let obsWsSocket = null;
        let obsWsConnectPromise = null;
        let obsWsIdentified = false;
        let obsWsResolvedInputName = '';
        let obsWsNextRequestId = 1;
        const obsWsPendingRequests = new Map();

        /* ── WAKE LOCK (mantém tela ligada) ── */
        let wakeLock = null;
        async function ativarWakeLock() {
            if (!('wakeLock' in navigator)) {
                console.log('Wake Lock não suportado neste navegador');
                return;
            }
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('✅ Tela mantida ligada (Wake Lock ativo)');
                wakeLock.addEventListener('release', () => {
                    console.log('Wake Lock liberado (o sistema pode dormir se inativo)');
                });
            } catch (e) {
                console.log('Não foi possível ativar Wake Lock:', e);
            }
        }
        // Reativa o Wake Lock se o iPad voltar do lock ou troca de app
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && wakeLock === null) {
                ativarWakeLock();
            }
        });
        // Pede o primeiro Wake Lock no primeiro toque em qualquer lugar (regra do iOS)
        document.addEventListener('click', () => {
            if (wakeLock === null) ativarWakeLock();
        }, { once: true });

        const abas = {
            letras: { items: [], idAtivo: null, carregada: false },
            midia:  { items: [], idAtivo: null, carregada: false }
        };

        /* ── MODO TEXTO ── */
        function toggleModo() {
            modoTexto = !modoTexto;
            document.body.classList.toggle('modo-texto-ativo', modoTexto);
            document.getElementById('atualContainer').classList.toggle('hidden', modoTexto);
            document.getElementById('textoContainer').classList.toggle('hidden', !modoTexto);
            document.getElementById('nextSlide').classList.toggle('hidden', modoTexto);
            document.getElementById('textoProximo').classList.toggle('hidden', !modoTexto);
            document.getElementById('btnToggle').style.background = modoTexto ? '#0a0' : '#c00';
            if (!modoTexto && videoPreviewActive && videoPreviewUrl && videoPreviewErrorUrl !== videoPreviewUrl) {
                mostrarVideoAtual();
            }
        }

        /* ── PAINEL PRÓXIMO (só no modo texto) ── */
        function toggleProximo() {
            mostrarProximo(!proximoVisivel);
        }
        function mostrarProximo(visivel) {
            proximoVisivel = visivel;
            document.getElementById('nextPanel').classList.toggle('hidden', !visivel);
            const btn = document.getElementById('btnProximo');
            btn.classList.toggle('oculto', !visivel);
            btn.innerHTML = (visivel ? '🙈' : '👁️') + '<span class="label">Próximo</span>';
        }

        /* ── API ── */
        async function api(action, body = {}) {
            const r = await fetch(getHolyricsApiBase() + '/api/' + action + '?token=' + encodeURIComponent(TOKEN), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            return r.json();
        }

        async function sendCmd(action) {
            try {
                await api(action);
                if (!modoTexto) updateData();
            } catch(e) { console.error(e); }
        }

        /* ── PRÉVIA DE VÍDEO PELA URL PUBLICADA NA API ── */
        const VIDEO_PREVIEW_POLL_MS = 750;
        let videoPreviewRequestInFlight = false;

        function normalizarUrlVideo(rawUrl) {
            const url = new URL(String(rawUrl || '').trim());
            if (url.protocol !== 'http:' && url.protocol !== 'https:') {
                throw new Error('A API retornou uma URL que não é HTTP/HTTPS.');
            }
            if (['localhost', '127.0.0.1', '::1'].includes(url.hostname.toLowerCase())) {
                url.hostname = getHolyricsIp();
            }
            let path = url.pathname.toLowerCase();
            while (path.endsWith('/')) path = path.slice(0, -1);
            if (!path.endsWith('/get_video')) {
                throw new Error('A URL recebida não aponta para /get_video.');
            }
            return url.toString();
        }

        function holyricsTemApresentacaoAtiva() {
            return latestCurrentPresentation !== undefined
                && latestCurrentPresentation !== null
                && typeof latestCurrentPresentation === 'object';
        }

        function assinaturaApresentacao(presentation) {
            if (!presentation || typeof presentation !== 'object') return '';
            return [
                presentation.id || '',
                presentation.type || '',
                presentation.name || '',
                presentation.slide_number == null ? '' : presentation.slide_number,
                presentation.slide_type || ''
            ].join('|');
        }

        function limparSlideProximo() {
            const next = document.getElementById('nextSlide');
            if (next) next.removeAttribute('src');
            const textoProximo = document.getElementById('textoProximo');
            if (textoProximo) textoProximo.src = 'about:blank';
            lastSlideNumber = null;
        }

        function recarregarTelaRetorno() {
            const atual = document.getElementById('atualContainer');
            if (atual) {
                atual.src = 'http://' + getHolyricsIp() + '/stage-view/widescreen?_=' + Date.now();
            }
        }

        function arquivoPareceVideo(media) {
            const nome = String((media && (media.path || media.name)) || '')
                .split(/[?#]/)[0].toLowerCase();
            return /\.(mp4|m4v|mov|webm|mkv|avi|mpeg|mpg|wmv|flv|3gp|ogv)$/i.test(nome);
        }

        async function pararVideoHolyricsSeNecessario() {
            const media = latestMediaPlayerInfo;
            if (mediaStopInFlight || !media || media.playing !== true || !arquivoPareceVideo(media)) {
                return false;
            }

            mediaStopInFlight = true;
            try {
                // O vídeo antigo deixa de ser a solicitação atual. Parar o VLC remove
                // a faixa "Player + tempo" que pode cobrir a apresentação no stage-view.
                await api('MediaPlayerAction', { action: 'stop' });
                console.log('Prévia Catedral: vídeo interrompido porque outro conteúdo foi solicitado.');
                return true;
            } catch (error) {
                console.warn('Prévia Catedral: não foi possível interromper o vídeo anterior:', error);
                return false;
            } finally {
                mediaStopInFlight = false;
            }
        }

        const aguardar = ms => new Promise(resolve => setTimeout(resolve, ms));

        async function obterApresentacaoAtual() {
            try {
                const result = await api('GetCurrentPresentation');
                if (result && result.status === 'ok') return result.data || null;
            } catch (error) {
                console.warn('Prévia Catedral: falha ao consultar apresentação após parar o vídeo:', error);
            }
            return null;
        }

        async function reapresentarSlideAtual(presentation) {
            try {
                // A API pode informar a troca de conteúdo antes que o Holyrics termine
                // a transição do VLC. Depois de parar, espera e consulta de novo para
                // não reaplicar o índice de um slide anterior.
                await aguardar(500);
                let atual = await obterApresentacaoAtual();
                if (atual) {
                    latestCurrentPresentation = atual;
                    ultimaAssinaturaApresentacao = assinaturaApresentacao(atual);
                } else {
                    atual = presentation || latestCurrentPresentation;
                }

                if (!atual) {
                    limparSlideProximo();
                    recarregarTelaRetorno();
                    return;
                }

                const slideNumber = Number(atual.slide_number);
                if (!Number.isFinite(slideNumber) || slideNumber < 1) {
                    recarregarTelaRetorno();
                    return;
                }

                // Reaplica o slide já selecionado após o stop. Essa ação é necessária
                // porque o Holyrics pode deixar o último frame do vídeo no retorno.
                await api('ActionGoToIndex', { index: slideNumber - 1 });
                await aguardar(350);
                recarregarTelaRetorno();
            } catch (error) {
                console.warn('Prévia Catedral: não foi possível reativar o slide atual:', error);
                recarregarTelaRetorno();
            }
        }

        async function registrarApresentacaoHolyrics(presentation, videoRequestJustDetected = false) {
            latestCurrentPresentation = presentation && typeof presentation === 'object'
                ? presentation : null;
            const assinatura = assinaturaApresentacao(latestCurrentPresentation);

            if (ultimaAssinaturaApresentacao === undefined) {
                ultimaAssinaturaApresentacao = assinatura;
                // Na inicialização, respeita o vídeo recém-iniciado; caso contrário,
                // a apresentação que já estava ativa é a fonte visível conhecida.
                if (assinatura && !fonteAtualSolicitada) fonteAtualSolicitada = 'holyrics';
                if (!assinatura) limparSlideProximo();
                return;
            }

            if (assinatura === ultimaAssinaturaApresentacao) return;
            const assinaturaAnterior = ultimaAssinaturaApresentacao;
            const fonteAnterior = fonteAtualSolicitada;
            ultimaAssinaturaApresentacao = assinatura;

            // Um início/reinício de vídeo detectado nesta mesma consulta é a solicitação
            // mais recente; não pare esse vídeo porque o Holyrics deixou de reportar slides.
            if (videoRequestJustDetected) {
                if (!assinatura) limparSlideProximo();
                console.log('Nova solicitação de vídeo prevalece sobre a mudança de apresentação.');
                return;
            }

            // Outra apresentação/letra, ou ESC para encerrar tudo, substitui o vídeo atual.
            fonteAtualSolicitada = 'holyrics';
            restaurarAtualHolyrics();
            if (!assinatura) limparSlideProximo();

            const videoAnteriorAtivo = fonteAnterior === 'video'
                || (latestMediaPlayerInfo && latestMediaPlayerInfo.playing === true
                    && arquivoPareceVideo(latestMediaPlayerInfo));

            console.log('Conteúdo mais recente do Holyrics:', assinatura || '(sem apresentação)',
                '| anterior:', assinaturaAnterior || '(sem apresentação)');

            if (videoAnteriorAtivo) {
                await pararVideoHolyricsSeNecessario();
                if (assinatura) await reapresentarSlideAtual(latestCurrentPresentation);
            }

            // A reativação do slide cuida de atualizar a tela após a transição do VLC.
            if (!videoAnteriorAtivo) recarregarTelaRetorno();
        }

        function registrarSolicitacaoDeVideo(payload, streamUrl) {
            const identidade = String(
                (payload && (payload.path || payload.name)) || streamUrl || ''
            );
            const playing = !!(payload && payload.playing === true);
            const tempo = Number(payload && payload.time_ms);
            let novaSolicitacao = false;

            if (!ultimaIdentidadeVideo) {
                // Se não há apresentação ativa na inicialização, o vídeo é o conteúdo atual.
                // Se já existe apresentação, preserva-a até detectar uma nova solicitação de vídeo.
                if (!holyricsTemApresentacaoAtiva() && !fonteAtualSolicitada && playing) {
                    novaSolicitacao = true;
                }
            } else {
                if (identidade && identidade !== ultimaIdentidadeVideo) {
                    novaSolicitacao = true;
                } else if (ultimoPlayingVideo === false && playing) {
                    novaSolicitacao = true;
                } else if (Number.isFinite(tempo) && Number.isFinite(ultimoTempoVideoMs)
                    && tempo < ultimoTempoVideoMs - 2500) {
                    // O mesmo arquivo reiniciado desde o começo também conta como nova solicitação.
                    novaSolicitacao = true;
                }
            }

            ultimaIdentidadeVideo = identidade;
            ultimoPlayingVideo = playing;
            if (Number.isFinite(tempo)) ultimoTempoVideoMs = tempo;

            if (novaSolicitacao) {
                videoRequestJustDetectedThisPoll = true;
                fonteAtualSolicitada = 'video';
                console.log('Conteúdo mais recente: vídeo', identidade);
            } else if (!fonteAtualSolicitada && !holyricsTemApresentacaoAtiva() && playing) {
                fonteAtualSolicitada = 'video';
            }
        }

        function mostrarVideoAtual() {
            // A última solicitação decide qual conteúdo fica em primeiro plano.
            if (modoTexto || fonteAtualSolicitada !== 'video') return;
            videoPreviewActive = true;
            document.getElementById('atualContainer').classList.add('hidden');
            document.getElementById('videoAtual').classList.remove('hidden');
        }

        function restaurarAtualHolyrics() {
            videoPreviewActive = false;
            const video = document.getElementById('videoAtual');
            video.classList.add('hidden');
            video.pause();
            document.getElementById('atualContainer').classList.toggle('hidden', modoTexto);
        }

        function limparPreviaRecebida() {
            restaurarAtualHolyrics();
            const video = document.getElementById('videoAtual');
            video.onerror = null;
            video.onloadedmetadata = null;
            video.oncanplay = null;
            video.removeAttribute('src');
            video.load();
            videoPreviewUrl = '';
            videoPreviewPath = '';
            videoPreviewErrorUrl = '';
            lastReceivedPreviewSignature = '';
            latestMediaPlayerInfo = null;
            // A ausência do vídeo encerra a reprodução anterior; se o mesmo arquivo
            // voltar a tocar, isso será reconhecido como uma nova solicitação.
            ultimoPlayingVideo = false;
        }

        function sincronizarTempoVideo(info) {
            const video = document.getElementById('videoAtual');
            const currentMs = Number(info && info.time_ms);
            if (video.readyState >= 1 && Number.isFinite(currentMs) && currentMs >= 0) {
                const wanted = currentMs / 1000;
                if (Math.abs(video.currentTime - wanted) > 1.25) {
                    try { video.currentTime = wanted; } catch (_) {}
                }
            }

            if (info && info.playing === true) {
                if (video.paused) video.play().catch(() => {});
            } else if (!video.paused) {
                video.pause();
            }
        }

        function receberUrlVideoApi(payload) {
            if (!payload || payload.available !== true || !payload.url) {
                if (videoPreviewUrl || videoPreviewActive) limparPreviaRecebida();
                return;
            }

            let streamUrl;
            try {
                streamUrl = normalizarUrlVideo(payload.url);
            } catch (error) {
                console.warn('Prévia Catedral: URL recebida inválida:', error);
                return;
            }

            latestMediaPlayerInfo = payload;
            videoPreviewPath = String(payload.path || payload.name || videoPreviewPath || '');
            const video = document.getElementById('videoAtual');

            // Registra se este vídeo representa uma nova solicitação.
            // Um vídeo antigo mantido no VLC não deve reassumir a tela sozinho.
            registrarSolicitacaoDeVideo(payload, streamUrl);
            if (fonteAtualSolicitada !== 'video') {
                if (videoPreviewActive || !video.classList.contains('hidden')) {
                    restaurarAtualHolyrics();
                }
                return;
            }

            if (videoPreviewErrorUrl === streamUrl) return;

            if (streamUrl !== videoPreviewUrl) {
                videoPreviewUrl = streamUrl;
                videoPreviewErrorUrl = '';
                video.pause();
                video.muted = true;
                video.playsInline = true;

                video.onerror = () => {
                    if (videoPreviewUrl !== streamUrl) return;
                    videoPreviewErrorUrl = streamUrl;
                    restaurarAtualHolyrics();
                    console.warn('Prévia Catedral: a URL foi recebida, mas o dispositivo não conseguiu reproduzir o vídeo. Verifique se o IP e a porta do serviço de vídeo são acessíveis neste aparelho.');
                };
                video.onloadedmetadata = () => {
                    if (videoPreviewUrl === streamUrl && latestMediaPlayerInfo) {
                        sincronizarTempoVideo(latestMediaPlayerInfo);
                    }
                };
                video.oncanplay = () => {
                    if (videoPreviewUrl !== streamUrl) return;
                    if (fonteAtualSolicitada !== 'video') {
                        restaurarAtualHolyrics();
                        return;
                    }
                    sincronizarTempoVideo(latestMediaPlayerInfo || payload);
                    mostrarVideoAtual();
                    if (!latestMediaPlayerInfo || latestMediaPlayerInfo.playing === true) {
                        video.play().catch(error => {
                            console.warn('Prévia Catedral: reprodução automática bloqueada pelo dispositivo:', error);
                        });
                    }
                };

                video.src = streamUrl;
                video.load();
            }

            if (video.readyState >= 1) sincronizarTempoVideo(payload);
            if (video.readyState >= 2) mostrarVideoAtual();
        }

        async function atualizarPreviaVideo() {
            if (videoPreviewRequestInFlight) {
                setTimeout(atualizarPreviaVideo, VIDEO_PREVIEW_POLL_MS);
                return;
            }

            videoPreviewRequestInFlight = true;
            try {
                const response = await api('GetCatedralVideoPreview');
                if (!response || response.status !== 'ok' || !response.data) {
                    throw new Error('A API não retornou dados válidos de GetCatedralVideoPreview.');
                }

                // O API Server do Holyrics pode encapsular o resultado em vários níveis:
                // { status:"ok", data:{ status:"ok", data:{ available:true, url:"..." } } }.
                // Desembrulha a resposta até alcançar o objeto que contém available/url.
                let previewData = response;
                for (let i = 0; i < 5 && previewData && typeof previewData === 'object'
                    && !Object.prototype.hasOwnProperty.call(previewData, 'available')
                    && previewData.data && typeof previewData.data === 'object'; i++) {
                    previewData = previewData.data;
                }

                // Processa a informação do VLC primeiro, para saber se acabou de ser
                // solicitada uma reprodução nova antes de interpretar a mudança da apresentação.
                videoRequestJustDetectedThisPoll = false;
                receberUrlVideoApi(previewData);

                try {
                    const presentation = await api('GetCurrentPresentation');
                    if (presentation && presentation.status === 'ok') {
                        await registrarApresentacaoHolyrics(
                            presentation.data,
                            videoRequestJustDetectedThisPoll
                        );
                    }
                } catch (_) {
                    // Preserva o último estado conhecido se a consulta falhar temporariamente.
                }
            } catch (error) {
                console.warn('Prévia Catedral: falha ao consultar GetCatedralVideoPreview:', error);
            } finally {
                videoPreviewRequestInFlight = false;
                setTimeout(atualizarPreviaVideo, VIDEO_PREVIEW_POLL_MS);
            }
        }

        /* ── LOOP DE SLIDE ── */
        async function updateData() {
            if (modoTexto) { setTimeout(updateData, 2000); return; }
            try {
                const j = await api('GetCurrentPresentation', {
                    include_slides: true,
                    include_slide_preview: true
                });
                if (j.status === 'ok' && j.data) {
                    const atual = Number(j.data.slide_number);
                    // Só recarrega o iframe quando o slide MUDA (evita reiniciar o vídeo a cada 2s)
                    if (atual !== lastSlideNumber) {
                        lastSlideNumber = atual;
                        document.getElementById('atualContainer').src = 'http://' + getHolyricsIp() + '/stage-view/widescreen?_=' + Date.now();
                    }
                    if (j.data.slides && j.data.slides[atual]) {
                        document.getElementById('nextSlide').src =
                            'data:image/jpeg;base64,' + j.data.slides[atual].preview;
                    }
                } else if (j && j.status === 'ok' && j.data == null) {
                    // ESC/fechamento: não manter o slide anterior no painel "Próximo".
                    if (lastSlideNumber !== null || document.getElementById('nextSlide').getAttribute('src')) {
                        limparSlideProximo();
                    }
                }
            } catch(e) { /* silencioso */ }
            setTimeout(updateData, 2000);
        }

        /* ── GAVETA ── */
        function toggleGaveta() {
            gavetaAberta ? fecharGaveta() : abrirGaveta();
        }
        function abrirGaveta() {
            gavetaAberta = true;
            document.getElementById('gaveta').classList.add('aberta');
            document.getElementById('btnPlaylist').classList.add('ativo');
            if (!abas[abaAtual].carregada) carregarAba(abaAtual);
        }
        function fecharGaveta() {
            gavetaAberta = false;
            document.getElementById('gaveta').classList.remove('aberta');
            document.getElementById('btnPlaylist').classList.remove('ativo');
        }
        function trocarAba(aba) {
            if (aba === abaAtual) return;
            abaAtual = aba;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('ativa'));
            document.getElementById('tab-' + aba).classList.add('ativa');
            document.getElementById('painel-letras').classList.toggle('hidden', aba !== 'letras');
            document.getElementById('painel-midia').classList.toggle('hidden',  aba !== 'midia');
            if (!abas[aba].carregada) carregarAba(aba);
        }
        function carregarAbaAtual() {
            abas[abaAtual].carregada = false;
            carregarAba(abaAtual);
        }

        /* ── CARREGAMENTO ── */
        async function carregarAba(aba) {
            const statusEl = document.getElementById('status-' + aba);
            const listaEl  = document.getElementById('lista-'  + aba);
            statusEl.innerHTML = '<span class="spinner"></span> Carregando…';
            listaEl.innerHTML  = '';
            try {
                const endpoint = aba === 'letras' ? 'GetLyricsPlaylist' : 'GetMediaPlaylist';
                const j = await api(endpoint);
                if (j.status !== 'ok' || !Array.isArray(j.data)) {
                    statusEl.textContent = '⚠️ Lista vazia ou não disponível.';
                    return;
                }
                abas[aba].items    = j.data;
                abas[aba].carregada = true;
                statusEl.innerHTML = '';
                renderAba(aba);
            } catch(e) {
                statusEl.textContent = '❌ Erro ao conectar ao Holyrics.';
            }
        }

        /* ── RENDER ── */
        const ICONES = {
            title: '▬', song: '🎵', verse: '📖', text: '📝',
            audio: '🔊', video: '🎬', image: '🖼️', file: '📄',
            announcement: '📢', automatic_presentation: '▶',
            countdown: '⏱️', countdown_cp: '⏱️', cp_text: '📝',
            plain_text: '📝', uri: '🔗', global_action: '⚙️',
            api: '⚡', script: '💻',
        };

        function nomeArquivo(path) {
            if (!path) return '—';
            return path.split(/[/\\]/).pop();
        }

        function renderAba(aba) {
            const lista  = document.getElementById('lista-' + aba);
            const estado = abas[aba];
            lista.innerHTML = '';

            if (!estado.items.length) {
                lista.innerHTML = '<div style="padding:20px;text-align:center;color:#555">Lista vazia</div>';
                return;
            }

            estado.items.forEach(item => {
                const tipo     = item.type || 'file';
                const nome     = item.title || nomeArquivo(item.name);
                const artista  = item.artist || '';
                const esTitulo = tipo === 'title';
                const ativo    = item.id && item.id === estado.idAtivo;

                const div = document.createElement('div');
                div.className = 'playlist-item' +
                    (esTitulo ? ' titulo-secao' : '') +
                    (ativo    ? ' ativo'         : '');

                if (!esTitulo) {
                    div.title = nome + (artista ? ' — ' + artista : '');
                    div.addEventListener('click', () => acionarItem(aba, item.id));
                }

                const iconeEl = document.createElement('span');
                iconeEl.className   = 'item-icone';
                iconeEl.textContent = ICONES[tipo] || (aba === 'letras' ? '🎵' : '📄');

                const infoEl = document.createElement('div');
                infoEl.className = 'item-info';

                const nomeEl = document.createElement('div');
                nomeEl.className   = 'item-nome';
                nomeEl.textContent = nome;
                infoEl.appendChild(nomeEl);

                if (artista && !esTitulo) {
                    const artistaEl = document.createElement('div');
                    artistaEl.className   = 'item-artista';
                    artistaEl.textContent = artista;
                    infoEl.appendChild(artistaEl);
                }

                div.appendChild(iconeEl);
                div.appendChild(infoEl);

                if (!esTitulo) {
                    const tipoEl = document.createElement('span');
                    tipoEl.className   = 'item-tipo';
                    tipoEl.textContent = tipo !== 'song' ? tipo : '';
                    div.appendChild(tipoEl);

                    if (ativo) {
                        const badge = document.createElement('span');
                        badge.className   = 'badge-ativo';
                        badge.textContent = '▶';
                        div.appendChild(badge);
                    }
                }

                lista.appendChild(div);
            });
        }

        /* ── ACIONAR ITEM ── */
        async function acionarItem(aba, id) {
            if (!id) return;
            try {
                const endpoint = aba === 'letras' ? 'ShowLyrics' : 'MediaPlaylistAction';
                const j = await api(endpoint, { id });
                if (j.status === 'ok') {
                    abas[aba].idAtivo = id;
                    renderAba(aba);
                    const el = document.querySelector('.playlist-item.ativo');
                    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            } catch(e) {
                console.error('Erro ao acionar item:', e);
            }
        }

        /* ── Inicialização e recuperação de IP do Holyrics ── */
        // Alguns servidores Holyrics respondem ao GetMediaPlayerInfo mesmo quando
        // GetCurrentPresentation retorna erro; qualquer endpoint conhecido que responda
        // corretamente confirma a conexão para evitar falsos alertas de IP.
        async function testarConexaoHolyrics() {
            try {
                const apresentacao = await api('GetCurrentPresentation', {});
                if (apresentacao && apresentacao.status === 'ok') return true;
            } catch (_) {}

            try {
                const player = await api('GetMediaPlayerInfo', {});
                if (player && player.status === 'ok' && player.data) return true;
            } catch (_) {}

            return false;
        }

        async function iniciarAplicativo() {
            aplicarEnderecoHolyricsNasTelas();
            let conexaoHolyricsConfirmada = await testarConexaoHolyrics();

            if (!conexaoHolyricsConfirmada) {
                const atual = getHolyricsIp();
                const resposta = prompt(
                    'Não consegui confirmar a conexão com o Holyrics no endereço ' + atual + '.\n\n' +
                    'Digite o IP atual do computador onde o Holyrics está aberto.',
                    atual
                );

                if (resposta !== null && resposta.trim()) {
                    const novoIp = resposta.trim()
                        .replace(/^https?:\/\//i, '')
                        .replace(/\/+$/, '')
                        .replace(/:\d+$/, '');

                    if (!novoIp || /[\s/?#]/.test(novoIp)) {
                        alert('Endereço inválido. Digite somente o IP ou nome do computador.');
                    } else {
                        localStorage.setItem(HOLYRICS_IP_KEY, novoIp);
                        aplicarEnderecoHolyricsNasTelas();
                        limparConexaoObsVideo();
                        conexaoHolyricsConfirmada = await testarConexaoHolyrics();

                        if (!conexaoHolyricsConfirmada) {
                            alert('Não consegui confirmar uma resposta válida da API do Holyrics em ' + novoIp +
                                '. A prévia de vídeo depende da ação GetCatedralVideoPreview no API Server do Holyrics.');
                        }
                    }
                }
                aplicarEnderecoHolyricsNasTelas();
            }

            // A prévia usa os quadros fornecidos diretamente pelo Holyrics.
            updateData();
            atualizarPreviaVideo();
        }

        iniciarAplicativo();
    </script>
